<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AAA Internal · Sign in</title>
    <style>
      :root {
        --teal: #004d43;
        --lime: #e6ff2b;
        --cream: #f9f7f2;
        --body: #636363;
        --gray: #898a8d;
        --divider: #d8d8d8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #010101;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid var(--divider);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }
      .kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gray);
      }
      h1 { font-size: 20px; color: var(--teal); margin: 4px 0 0; }
      .sub { font-size: 14px; color: var(--body); margin-top: 8px; }
      button {
        font-family: inherit;
        font-size: 14px;
      }
      .btn {
        width: 100%;
        border-radius: 10px;
        padding: 11px;
        cursor: pointer;
        border: 1px solid var(--divider);
        background: #fff;
        transition: background 0.15s;
        margin-top: 16px;
      }
      .btn:hover { background: var(--cream); }
      .msg { font-size: 13px; margin-top: 16px; border-radius: 10px; padding: 12px; }
      .msg-ok { color: var(--teal); background: rgba(230, 255, 43, 0.3); }
      .msg-err { color: #b00020; background: #fdecea; }
      .hidden { display: none; }
      .foot { font-size: 11px; color: var(--gray); margin-top: 20px; }
      #signin { margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">Automation Architecture</div>
      <h1>AAA Internal · Sign in</h1>
      <p class="sub">Internal tool — authorized access only.</p>

      <div id="signin"></div>

      <div id="forbidden" class="hidden">
        <div class="msg msg-err">
          This account isn’t authorized for the founder view. Sign in with an
          authorized account.
        </div>
        <button class="btn" id="switch" type="button">Sign out &amp; use another account</button>
      </div>

      <div id="status" class="msg hidden"></div>
      <p class="foot">Access is gated at the edge — authorized emails only.</p>
    </div>

    <script type="module">
      const ALLOWED = "brad@automationarchitecture.ai";
      const params = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const status = $("status");
      function show(el) { el.classList.remove("hidden"); }
      function hide(el) { el.classList.add("hidden"); }
      function setStatus(text, ok) {
        status.textContent = text;
        status.className = "msg " + (ok ? "msg-ok" : "msg-err");
        show(status);
      }

      function clerkFrontendApi(publishableKey) {
        const encoded = publishableKey.split("_")[2] || "";
        return atob(encoded).replace(/\$+$/, "");
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.crossOrigin = "anonymous";
          script.onload = resolve;
          script.onerror = () => reject(new Error("Failed to load Clerk"));
          document.head.appendChild(script);
        });
      }

      function sessionEmail(clerk) {
        const user = clerk.user;
        if (!user) return "";
        return (
          user.primaryEmailAddress?.emailAddress ||
          user.emailAddresses?.[0]?.emailAddress ||
          ""
        )
          .trim()
          .toLowerCase();
      }

      async function boot() {
        const res = await fetch("/api/clerk-config", { cache: "no-store" });
        if (!res.ok) throw new Error("Clerk config unavailable");
        const { publishableKey } = await res.json();
        if (!publishableKey) {
          setStatus("Sign-in is not configured (missing CLERK_PUBLISHABLE_KEY).", false);
          return;
        }

        const fapi = clerkFrontendApi(publishableKey);
        await loadScript(`https://${fapi}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`);
        const clerk = new window.Clerk(publishableKey);
        await clerk.load({
          signInUrl: "/login",
          signUpUrl: "/login",
          afterSignInUrl: "/",
          afterSignUpUrl: "/",
        });

        const forbidden = params.get("error") === "forbidden";
        const email = sessionEmail(clerk);

        if (clerk.isSignedIn && email === ALLOWED && !forbidden) {
          location.replace("/");
          return;
        }

        if (forbidden || (clerk.isSignedIn && email && email !== ALLOWED)) {
          hide($("signin"));
          show($("forbidden"));
          $("switch").addEventListener("click", async () => {
            await clerk.signOut();
            location.href = "/login";
          });
          return;
        }

        if (params.get("error") === "auth") {
          setStatus("Sign-in failed — please try again.", false);
        }

        clerk.mountSignIn($("signin"), {
          routing: "hash",
          forceRedirectUrl: "/",
          appearance: {
            variables: {
              colorPrimary: "#004d43",
              colorBackground: "#ffffff",
              colorText: "#010101",
              borderRadius: "10px",
            },
          },
        });
      }

      boot().catch((err) => {
        setStatus(err.message || "Sign-in failed — please try again.", false);
      });
    </script>
  </body>
</html>
